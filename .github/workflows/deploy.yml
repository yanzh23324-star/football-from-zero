name: 构建并发布第一脚
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: first-kick-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: 生成独立页面
        run: python scripts/build.py
      - name: 检查课程与页面链接
        run: python scripts/check.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          retention-days: 1
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v5.0.1
